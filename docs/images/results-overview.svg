<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Repeated shared-test results</title>
  <desc id="desc">Grouped horizontal bars compare accuracy, macro-F1, and ROC-AUC for AD versus MCI, AD versus control, and MCI versus control.</desc>
  <rect width="900" height="390" rx="22" fill="#f8fafc"/>
  <text x="40" y="48" fill="#10233d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Repeated shared-test performance</text>
  <text x="40" y="74" fill="#58708d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Selected TxT configuration · descriptive means across repeated splits</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">
    <rect x="559" y="34" width="13" height="13" rx="3" fill="#2563eb"/><text x="579" y="46" fill="#344962">Accuracy</text>
    <rect x="657" y="34" width="13" height="13" rx="3" fill="#8b5cf6"/><text x="677" y="46" fill="#344962">Macro-F1</text>
    <rect x="760" y="34" width="13" height="13" rx="3" fill="#10b981"/><text x="780" y="46" fill="#344962">ROC-AUC</text>
  </g>

  <g stroke="#d8e1eb" stroke-width="1">
    <line x1="190" y1="100" x2="190" y2="330"/>
    <line x1="350" y1="100" x2="350" y2="330"/>
    <line x1="510" y1="100" x2="510" y2="330"/>
    <line x1="670" y1="100" x2="670" y2="330"/>
    <line x1="830" y1="100" x2="830" y2="330"/>
  </g>
  <g fill="#71849a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">
    <text x="190" y="352">0.0</text><text x="350" y="352">0.2</text><text x="510" y="352">0.4</text><text x="670" y="352">0.6</text><text x="830" y="352">0.8</text>
  </g>

  <g fill="#243b55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="end">
    <text x="166" y="145">AD vs MCI</text>
    <text x="166" y="227">AD vs control</text>
    <text x="166" y="309">MCI vs control</text>
  </g>

  <g>
    <rect x="190" y="116" width="506" height="15" rx="5" fill="#2563eb"/><text x="704" y="128" fill="#24405d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">0.632</text>
    <rect x="190" y="137" width="479" height="15" rx="5" fill="#8b5cf6"/><text x="677" y="149" fill="#24405d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">0.599</text>
    <rect x="190" y="158" width="529" height="15" rx="5" fill="#10b981"/><text x="727" y="170" fill="#24405d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">0.661</text>

    <rect x="190" y="198" width="592" height="15" rx="5" fill="#2563eb"/><text x="790" y="210" fill="#24405d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">0.740</text>
    <rect x="190" y="219" width="589" height="15" rx="5" fill="#8b5cf6"/><text x="787" y="231" fill="#24405d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">0.736</text>
    <rect x="190" y="240" width="674" height="15" rx="5" fill="#10b981"/><text x="872" y="252" fill="#24405d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">0.843</text>

    <rect x="190" y="280" width="592" height="15" rx="5" fill="#2563eb"/><text x="790" y="292" fill="#24405d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">0.740</text>
    <rect x="190" y="301" width="587" height="15" rx="5" fill="#8b5cf6"/><text x="785" y="313" fill="#24405d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">0.734</text>
    <rect x="190" y="322" width="642" height="15" rx="5" fill="#10b981"/><text x="840" y="334" fill="#24405d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">0.803</text>
  </g>
  <text x="40" y="375" fill="#71849a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Research use only. Values are not clinical performance claims.</text>
</svg>
