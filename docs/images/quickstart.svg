<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Three-step Transcriptome Transformer workflow</title>
  <desc id="desc">Prepare GEO data, build an optional PPI embedding, then train the multi-task Transcriptome Transformer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#11233d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1000" height="450" rx="24" fill="url(#bg)"/>
  <text x="52" y="58" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Three entry points, one reproducible workflow</text>
  <text x="52" y="88" fill="#9fb2ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Each stage exports its inputs, configuration, and provenance.</text>

  <g filter="url(#shadow)">
    <rect x="52" y="124" width="276" height="252" rx="18" fill="#10233d" stroke="#244467"/>
    <rect x="362" y="124" width="276" height="252" rx="18" fill="#10233d" stroke="#244467"/>
    <rect x="672" y="124" width="276" height="252" rx="18" fill="#10233d" stroke="#244467"/>
  </g>

  <circle cx="84" cy="160" r="17" fill="#38bdf8"/>
  <text x="84" y="166" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-size="17" font-weight="800">1</text>
  <text x="110" y="166" fill="#f8fafc" font-family="Arial,sans-serif" font-size="19" font-weight="700">Prepare data</text>
  <rect x="72" y="192" width="236" height="118" rx="10" fill="#050b14"/>
  <g fill="#dbeafe" font-family="Consolas,monospace" font-size="12">
    <text x="88" y="225"><tspan fill="#38bdf8">$</tspan> Rscript data/</text>
    <text x="104" y="245">download_geo.R …</text>
    <text x="88" y="275"><tspan fill="#38bdf8">$</tspan> python experiments/</text>
    <text x="104" y="295">prepare_data.py</text>
  </g>
  <text x="72" y="341" fill="#8fa7c2" font-family="Arial,sans-serif" font-size="12">711 samples · 19,460 genes</text>

  <circle cx="394" cy="160" r="17" fill="#a78bfa"/>
  <text x="394" y="166" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-size="17" font-weight="800">2</text>
  <text x="420" y="166" fill="#f8fafc" font-family="Arial,sans-serif" font-size="19" font-weight="700">Initialize PPI</text>
  <rect x="382" y="192" width="236" height="118" rx="10" fill="#050b14"/>
  <g fill="#dbeafe" font-family="Consolas,monospace" font-size="12">
    <text x="398" y="229"><tspan fill="#a78bfa">$</tspan> python experiments/</text>
    <text x="414" y="249">build_ppi_embedding.py</text>
    <text x="414" y="275">--embedding-dim 128</text>
    <text x="414" y="295">--device cuda</text>
  </g>
  <text x="382" y="341" fill="#8fa7c2" font-family="Arial,sans-serif" font-size="12">Optional HIPPIE node2vec prior</text>

  <circle cx="704" cy="160" r="17" fill="#34d399"/>
  <text x="704" y="166" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-size="17" font-weight="800">3</text>
  <text x="730" y="166" fill="#f8fafc" font-family="Arial,sans-serif" font-size="19" font-weight="700">Train TxT</text>
  <rect x="692" y="192" width="236" height="118" rx="10" fill="#050b14"/>
  <g fill="#dbeafe" font-family="Consolas,monospace" font-size="12">
    <text x="708" y="229"><tspan fill="#34d399">$</tspan> python experiments/</text>
    <text x="724" y="249">train.py</text>
    <text x="724" y="275">--seed 101</text>
    <text x="724" y="295">--device cuda …</text>
  </g>
  <text x="692" y="341" fill="#8fa7c2" font-family="Arial,sans-serif" font-size="12">Metrics · predictions · manifest</text>

  <path d="M328 250h34" stroke="#6f89a6" stroke-width="2"/><path d="M353 243l9 7-9 7" fill="none" stroke="#6f89a6" stroke-width="2"/>
  <path d="M638 250h34" stroke="#6f89a6" stroke-width="2"/><path d="M663 243l9 7-9 7" fill="none" stroke="#6f89a6" stroke-width="2"/>

  <rect x="52" y="398" width="896" height="2" fill="#244467"/>
  <text x="52" y="425" fill="#9fb2ca" font-family="Arial,sans-serif" font-size="13">No VMA · no one-off launchers · generated data and results stay outside Git</text>
</svg>
